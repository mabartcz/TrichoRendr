[workspace]
resolver = "3"
members = ["launcher", "xtask"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow" # product names (SketchUp, TrichoRendr) are not code

[profile.release]
opt-level = "z" # the launcher only waits on Blender; small beats fast
lto = true
strip = true
